{% extends 'tienda/base.html' %}
{% block titulo %}Editar Usuario - Go Play!{% endblock %}

{% block contenido %}
<div class="container my-5">
    <h2 class="text-uppercase fw-bold text-white mb-4">Editar Perfil de <span class="text-info">{{ usuario.username }}</span></h2>
    
    <div class="row">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-lg border-0" style="background-color: var(--gp-blue-card);">
                <div class="card-body p-4">
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label text-warning fw-bold">Nombre de Usuario:</label>
                            <input type="text" class="form-control text-bg-dark border-secondary text-muted" value="{{ usuario.username }}" readonly>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-warning fw-bold">Nombre Real:</label>
                            <input type="text" class="form-control text-bg-dark border-secondary text-muted" value="{{ usuario.first_name }} {{ usuario.last_name }}" readonly>
                        </div>

                        <hr class="border-secondary my-4">

                        <div class="mb-4">
                            <label class="form-label text-warning fw-bold">Asignar Nuevo Rol:</label>
                            {{ form.rol }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Teléfono (Opcional):</label>
                            {{ form.telefono }}
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light">Dirección (Opcional):</label>
                            {{ form.direccion }}
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
                            <a href="{% url 'mantenedor_usuarios' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-warning fw-bold text-dark">Guardar Cambios</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
