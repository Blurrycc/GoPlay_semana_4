{% extends 'tienda/base.html' %}
{% load static %}

{% block titulo %}Go Play! - Tienda Geek y Videojuegos{% endblock %}

{% block contenido %}
<div class="container mt-5">
    <h2 class="text-info fw-bold mb-4 border-bottom border-info pb-2">Novedades y Ofertas Externas</h2>

    <!-- Sección API 1: Amiibo (Figuras Coleccionables) -->
    <h4 class="text-white mt-5 mb-3"><i class="fas fa-gamepad text-warning"></i> Coleccionables Destacados</h4>
    <div id="giveaways-container" class="row g-4">
        <div class="col-12 text-center text-light" id="loading-giveaways">
            <div class="spinner-border text-info" role="status"></div>
            <p>Buscando figuras...</p>
        </div>
    </div>

    <!-- Sección API 2: CheapShark (Ofertas con Reseñas) -->
    <h4 class="text-white mt-5 mb-3"><i class="fas fa-tags text-success"></i> Ofertas Destacadas y Reseñas</h4>
    <div id="ofertas-container" class="row g-4 mb-5">
        <div class="col-12 text-center text-light" id="loading-ofertas">
            <div class="spinner-border text-success" role="status"></div>
            <p>Cazando ofertas...</p>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MOTOR JAVASCRIPT PARA CONSUMIR APIs EXTERNAS -->
<!-- ========================================== -->
<script>
    // CONSUMO API 1: Rick & Morty API API (Figuras Coleccionables)
    async function obtenerColeccionables() {
        try {
            // Pedimos exactamente los personajes 1, 2, 3 y 4 (ultra rápido)
            const respuesta = await fetch('https://rickandmortyapi.com/api/character/1,2,3,4');
            const datos = await respuesta.json();
            
            const contenedor = document.getElementById('giveaways-container');
            document.getElementById('loading-giveaways').style.display = 'none';

            // Recorremos los 4 personajes que nos llegaron
            datos.forEach(figura => {
                contenedor.innerHTML += `
                    <div class="col-12 col-md-3">
                        <div class="card bg-secondary text-white h-100 border-0 shadow p-3 text-center">
                            <img src="${figura.image}" class="card-img-top rounded mx-auto" style="height: 150px; width: 150px; object-fit: cover;" alt="${figura.name}">
                            <div class="card-body d-flex flex-column pb-0">
                                <h6 class="card-title fw-bold text-truncate mt-2">${figura.name}</h6>
                                <p class="small mb-2 text-warning">Especie: ${figura.species}</p>
                                <span class="badge bg-info text-dark mt-auto align-self-center">Figura Coleccionable</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error("Error al obtener los coleccionables:", error);
            document.getElementById('loading-giveaways').innerHTML = "Error al cargar las figuras.";
        }
    }

    // CONSUMO API 2: CheapShark (Ofertas y Reseñas)
    async function obtenerOfertas() {
        try {
            const respuesta = await fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1&pageSize=4');
            const datos = await respuesta.json();
            
            const contenedor = document.getElementById('ofertas-container');
            document.getElementById('loading-ofertas').style.display = 'none';

            datos.forEach(oferta => {
                contenedor.innerHTML += `
                    <div class="col-12 col-md-3">
                        <div class="card bg-secondary text-white h-100 border-0 shadow">
                            <img src="${oferta.thumb}" class="card-img-top" style="height: 120px; object-fit: cover; object-position: center;" alt="${oferta.title}">
                            <div class="card-body d-flex flex-column justify-content-between p-3">
                                <h6 class="card-title fw-bold">${oferta.title}</h6>
                                
                                <div class="mt-2">
                                    <span class="badge bg-info text-dark mb-2">Metacritic: ${oferta.metacriticScore}/100</span>
                                    
                                    <div class="d-flex align-items-center bg-dark rounded p-2">
                                        <span class="badge bg-success p-2 me-2">-${Math.round(oferta.savings)}%</span>
                                        <div class="text-end lh-1 pe-1 w-100">
                                            <small class="text-decoration-line-through text-secondary">USD ${oferta.normalPrice}</small><br>
                                            <span class="text-info fw-bold">USD ${oferta.salePrice}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error("Error al obtener las ofertas:", error);
            document.getElementById('loading-ofertas').innerHTML = "Error al cargar las ofertas.";
        }
    }

    // Ejecutamos ambas funciones automáticamente al abrir la página
    document.addEventListener("DOMContentLoaded", () => {
        obtenerColeccionables();
        obtenerOfertas();
    });
</script>
{% endblock %}
